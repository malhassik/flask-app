<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Вход | Логистрим</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            padding-top: 100px;
            text-align: center;
        }

        .card {
            background: #1e1e1e;
            width: 300px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            border: 1px solid #333;
        }

        input {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #2d2d2d;
            border: 1px solid #444;
            color: white;
            box-sizing: border-box;
            border-radius: 5px;
        }

        button {
            width: 100%;
            padding: 10px;
            background: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            background: #007bff;
        }

        .error {
            color: #ff4444;
            font-size: 14px;
            margin-bottom: 10px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h2>Вход в систему</h2>

        <!-- Вывод ошибки, если пароль неверный -->
        {% if error %}
        <div class="error">{{ error }}</div>
        {% endif %}

        <form method="POST" action="/login">
            <input type="password" name="password" placeholder="Введите пароль" required>
            <button type="submit">Войти</button>
        </form>

        <br>
        <a href="/" style="color: #777; font-size: 12px; text-decoration: none;">← На главную</a>
    </div>
</body>

</html>
