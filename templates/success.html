<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Успех | Логистрим</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            text-align: center;
            padding-top: 100px;
        }

        .card {
            background: #1e1e1e;
            width: 50%;
            margin: 0 auto;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            border: 1px solid #333;
        }

        h1 {
            color: #2ecc71;
            /* Яркий зеленый цвет успеха */
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #bbbbbb;
        }

        a {
            display: inline-block;
            margin-top: 30px;
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
            transition: 0.3s;
        }

        a:hover {
            color: #4da3ff;
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1>Спасибо, {{ name }}!</h1>
        <p>Ваша заявка успешно принята. Наш менеджер свяжется с вами в ближайшее время.</p>
        <a href="/">← Вернуться на главную</a>
    </div>
</body>

</html>
