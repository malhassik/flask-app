<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная | Логистрим</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #121212;
            /* Очень темный фон */
            color: #e0e0e0;
            /* Светло-серый текст */
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #ffffff;
            margin-bottom: 10px;
        }

        .container {
            background: #1e1e1e;
            /* Темная карточка */
            width: 50%;
            margin: 0 auto;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            /* Тень для объема */
            border: 1px solid #333;
        }

        form {
            margin-top: 25px;
            display: flex;
            flex-direction: column;
            gap: 15px;
            text-align: left;
        }

        label {
            font-weight: bold;
            color: #bbbbbb;
        }

        input {
            padding: 10px;
            background-color: #2d2d2d;
            /* Темное поле ввода */
            border: 1px solid #444;
            border-radius: 5px;
            color: white;
            /* Белый текст при вводе */
            font-size: 16px;
        }

        input:focus {
            outline: none;
            border-color: #007bff;
            /* Синяя рамка при клике */
        }

        button {
            padding: 12px;
            background: #0056b3;
            /* Синяя кнопка */
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: 0.3s;
        }

        button:hover {
            background: #007bff;
            /* Кнопка становится ярче при наведении */
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Добро пожаловать в {{ company_name }}!</h1>
        <p>Мы осуществляем надежные грузоперевозки по всей России.</p>

        <form action="/submit" method="POST">
            <div>
                <label>Ваше имя:</label><br>
                <input type="text" name="client_name" required style="width: 100%; box-sizing: border-box;">
            </div>
            <div>
                <label>Откуда:</label><br>
                <input type="text" name="from_city" required style="width: 100%; box-sizing: border-box;">
            </div>
            <div>
                <label>Куда:</label><br>
                <input type="text" name="to_city" required style="width: 100%; box-sizing: border-box;">
            </div>
            <button type="submit">Оставить заявку</button>
        </form>



    </div>

    <div style="margin-top: 30px; font-size: 14px;">
        <a href="/admin" style="color: #777; text-decoration: none;">Панель управления (для сотрудников)</a>
    </div>
</body>

</html>
