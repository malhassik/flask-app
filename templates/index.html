<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная | Транспортная компания</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding-top: 50px;
        }

        h1 {
            color: #333;
        }

        .container {
            background: white;
            width: 50%;
            margin: 0 auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Добро пожаловать в {{ company_name }}!</h1>
        <p>Мы осуществляем надежные грузоперевозки.</p>

        <!-- Форма заявки -->
        <form action="/submit" method="POST"
            style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px; text-align: left;">
            <label>Ваше имя:</label>
            <input type="text" name="client_name" required style="padding: 8px;">

            <label>Откуда:</label>
            <input type="text" name="from_city" required style="padding: 8px;">

            <label>Куда:</label>
            <input type="text" name="to_city" required style="padding: 8px;">

            <button type="submit"
                style="padding: 10px 20px; background: #007bff; color: white; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px;">
                Оставить заявку
            </button>
        </form>
    </div>
</body>

</html>
